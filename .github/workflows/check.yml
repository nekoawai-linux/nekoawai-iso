name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: shellcheck, image description, Live overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # scripts/check.sh needs KIWI and built RPM repositories, so the runner
      # validates what does not depend on them.
      - name: Shell syntax
        run: bash -n config.sh scripts/*.sh

      - name: Shell analysis
        # SC1090 is config/build.conf, read at run time and optional.
        # Warnings and above only: the info level is style advice, and
        # runners do not all carry the same shellcheck.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          shellcheck --shell=bash --severity=warning --exclude=SC1090 config.sh scripts/*.sh

      - name: Image description is well-formed
        run: python3 -c 'import xml.etree.ElementTree as ET; ET.parse("config.xml")'

      - name: The image boots the way the installer installs
        # EFI only: nekoawai-install refuses a machine that booted without
        # UEFI, so a BIOS entry only carries somebody as far as that refusal.
        run: |
          # Attributes and elements, not words: the comment in config.xml has
          # to be able to name what was taken out.
          if grep -n 'gpt_hybrid_mbr=\|<package name="grub2-i386-pc"' config.xml; then
            echo "the image description asks for legacy BIOS boot" >&2
            exit 1
          fi
          # eficsm is the one that decides it. Without it KIWI writes a BIOS
          # El Torito entry for an iso type whatever else the description says.
          if ! grep -n 'eficsm="false"' config.xml; then
            echo "eficsm is not disabled" >&2
            exit 1
          fi

      - name: The medium carries firmware
        # onlyRequired drops every recommendation, and the base pattern only
        # recommends the firmware set. An online installer that cannot bring
        # up an unknown network card is an installer that works in a virtual
        # machine and nowhere else.
        run: |
          if ! grep -n 'kernel-firmware-all' config.xml; then
            echo "the image description does not name kernel-firmware-all" >&2
            exit 1
          fi

      - name: Live overlay stays ASCII
        run: |
          if LC_ALL=C grep -rn '[^[:print:][:space:]]' root; then
            echo "Live overlay text must stay ASCII" >&2
            exit 1
          fi

      - name: Live overlay names the installer
        run: |
          grep -q 'Welcome to NekoAwai Live' root/usr/lib/issue.d/50-nekoawai-live.issue
          grep -q 'nekoawai-install' root/usr/lib/issue.d/50-nekoawai-live.issue
